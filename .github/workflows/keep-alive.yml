name: Keep RecipeLens awake

on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:         

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -fsS --retry 3 --retry-delay 30 --max-time 90 https://recipelens-backend.onrender.com/api/health
